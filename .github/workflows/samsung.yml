name: Samsung Exynos CI

on:
  push:
    branches: [test]
  pull_request:

jobs:
  test-samsung-quantmodels-linux:
    name: test-samsung-quantmodels-linux
    runs-on: [self-hosted, samsung-runner]
    env:
      # Map secret to env var expected by the script
      SECRET_SAMSUNG_AI_LITECORE_KEY: ${{ secrets.SAMSUNG_AI_LITECORE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update submodules
        shell: bash
        run: |
          # Force clean critical submodules to avoid shallow clone/detached head issues
          rm -rf third-party/json third-party/flatbuffers third-party/pybind11 third-party/cpuinfo
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Run Test Script
        shell: bash
        run: |
          set -ex

          # Ensure Conda is available in the shell
          if command -v conda >/dev/null 2>&1; then
             # Source conda to make 'activate' work
             source "$(conda info --base)/etc/profile.d/conda.sh"
          fi

          # FORCE PATH: Ensure conda environment binaries come first!
          # This fixes the issue where system cmake (3.22) is picked up instead of conda cmake (3.29+)
          export PATH=/opt/conda/envs/executorch/bin:$PATH

          # Setup python
          # Pre-install CPU-only PyTorch to prevent pip from pulling CUDA-enabled wheels from PyPI
          # This is critical because our runner has no CUDA, but standard linux wheels expect it.
          pip install --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cpu

          PYTHON_EXECUTABLE=python bash .ci/scripts/setup-linux.sh --build-tool "cmake"
          # The generic Linux job chooses to use base env, not the one setup by the image
          # Using stricter check to avoid failure if jq/conda missing in bare runner
          if command -v conda >/dev/null 2>&1; then
             CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
             conda activate "${CONDA_ENV}"
          fi

          echo "Checking cmake version..."
          which cmake
          cmake --version

          PYTHON_EXECUTABLE=python bash .ci/scripts/setup-linux.sh --build-tool "cmake"

          # Setup Samsung SDK (AI Lite Core) and install enn backend
          export SAMSUNG_AI_LITECORE_KEY=$SECRET_SAMSUNG_AI_LITECORE_KEY
          trap 'bash .ci/scripts/cleanup-samsung-linux-deps.sh' EXIT
          source .ci/scripts/setup-samsung-linux-deps.sh --device-connect false

          # Test quant models
          model_scripts="deeplab_v3 edsr inception_v3 inception_v4 mobilenet_v2 mobilenet_v3 resnet18 resnet50 vit wav2letter"
          for m_script in $model_scripts; do
            python -m executorch.examples.samsung.scripts.${m_script} -c e9955 -p A8W8
          done

  test-samsung-models-linux:
    name: test-samsung-models-linux
    runs-on: [self-hosted, samsung-runner]
    env:
      SECRET_SAMSUNG_AI_LITECORE_KEY: ${{ secrets.SAMSUNG_AI_LITECORE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Test Script
        shell: bash
        run: |
          set -ex

          # Ensure Conda is available in the shell
          if command -v conda >/dev/null 2>&1; then
             # Source conda to make 'activate' work
             source "$(conda info --base)/etc/profile.d/conda.sh"
          fi

          # The generic Linux job chooses to use base env, not the one setup by the image
          if command -v conda >/dev/null 2>&1; then
             CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
             conda activate "${CONDA_ENV}"
          fi

          # Setup python
          PYTHON_EXECUTABLE=python bash .ci/scripts/setup-linux.sh --build-tool "cmake"

          # Setup Samsung SDK (AI Lite Core) and install enn backend
          export SAMSUNG_AI_LITECORE_KEY=$SECRET_SAMSUNG_AI_LITECORE_KEY
          trap 'bash .ci/scripts/cleanup-samsung-linux-deps.sh' EXIT
          source .ci/scripts/setup-samsung-linux-deps.sh --device-connect true

          # Check if device was reserved
          if [[ "${DEVICE_RESERVED:-0}" != "1" ]]; then
            echo "::warning::Skipping tests - no Samsung device available"
            exit 0
          fi

          # Test models
          python -m unittest discover -s backends/samsung/test/models -p "test_*.py"
